name: AI Engine CI
# CI disabled in parent repo — ai-engine is now a submodule with its own CI.
# Kept for reference; re-enable by restoring push/pull_request triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync frozen lockfile
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync frozen lockfile
        run: uv sync --frozen
      - name: Pyright typecheck
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync frozen lockfile
        run: uv sync --frozen
      - name: Pytest with coverage
        run: uv run pytest -v --cov=app --cov-report=xml --cov-report=term
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-engine-coverage
          path: ai-engine/coverage.xml
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync frozen lockfile
        run: uv sync --frozen
      - name: Bandit security scan
        run: uv run bandit -r app/ -x tests/

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Build engine image
        run: docker build -t ai-engine:ci ./ai-engine
