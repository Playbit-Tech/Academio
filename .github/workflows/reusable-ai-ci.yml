name: AI Engine CI (reusable)

# Sourced by private submodule repos via:
#   uses: Playbit-Tech/Academio/.github/workflows/reusable-ai-ci.yml@main
# Runs in the CALLER's repository context with the CALLER's token/secrets.
# This file never triggers on its own.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync frozen lockfile
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

  typecheck:
    name: Pyright Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync frozen lockfile
        run: uv sync --frozen

      - name: Pyright typecheck
        run: uv run pyright

  test:
    name: Pytest + Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y -qq poppler-utils tesseract-ocr libtesseract-dev

      - name: Sync frozen lockfile
        run: uv sync --frozen

      - name: Pytest with coverage
        run: uv run pytest -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-engine-coverage
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 3

  security:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync frozen lockfile
        run: uv sync --frozen

      - name: Bandit security scan
        run: uv run bandit -r app/ -x tests/