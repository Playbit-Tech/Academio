name: Frontend CI (reusable)

# Sourced by private submodule repos via:
#   uses: Playbit-Tech/Academio/.github/workflows/reusable-frontend-ci.yml@main
# Runs in the CALLER's repository context with the CALLER's token/secrets.
# This file never triggers on its own.

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "22"

permissions:
  contents: read

jobs:
  static-checks:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Run ESLint
        run: corepack yarn lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Run tests
        run: corepack yarn test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [static-checks, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Build application
        run: corepack yarn build