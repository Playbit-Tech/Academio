name: Frontend CI (reusable)

# Sourced by private submodule repos via:
#   uses: Playbit-Tech/Academio/.github/workflows/reusable-frontend-ci.yml@main
# Runs in the CALLER's repository context with the CALLER's token/secrets.
# This file never triggers on its own.
#
# Yarn 4 + Corepack: setup-node's `cache: yarn` pre-action runs `yarn cache dir`
# via the runner's global Yarn 1.22.22 and fails on the packageManager:
# yarn@4.17.0 check — UNLESS Corepack is enabled first. So we run setup-node
# once to install Node, enable Corepack (shims land in the Node bin dir, which
# is first on PATH), then run setup-node a second time with `cache: yarn` so
# the cache pre-action resolves to Yarn 4. Keep this ordering.

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "22"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack and activate Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate

      - name: Setup Node with Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: yarn test

      - name: Build application
        run: yarn build