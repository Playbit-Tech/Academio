name: Frontend CI (reusable)

# Sourced by private submodule repos via:
#   uses: Playbit-Tech/Academio/.github/workflows/reusable-frontend-ci.yml@main
# Runs in the CALLER's repository context with the CALLER's token/secrets.
# This file never triggers on its own.
#
# NOTE: do NOT pass `cache: yarn` to actions/setup-node here. setup-node's
# yarn-cache pre-action runs `yarn cache dir`, which invokes the runner's
# global Yarn 1.22.22 on PATH and fails on the packageManager: yarn@4.17.0
# check before any step runs. Yarn 4 caches its own packages — drop the
# flag rather than fight the PATH shadow.

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "22"

permissions:
  contents: read

jobs:
  static-checks:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack and activate Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack and activate Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [static-checks, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack and activate Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build