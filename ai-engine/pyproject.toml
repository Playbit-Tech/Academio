[project]
name = "ai-engine"
version = "0.1.0"
description = "Academio AI engine — Python compute service (Phase 1 skeleton)"
requires-python = ">=3.13"
dependencies = [
  "anthropic>=0.120.2",
  "fastapi[standard]>=0.140,<0.141",
  "openai>=2.52.0",
  "openpyxl>=3.1.5",
  "pdf2image>=1.17.0",
  "pgvector>=0.5.0",
  "pillow>=12.3.0",
  "psycopg-pool>=3.3.1",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings>=2.13",
  "pypdf>=6.14.2",
  "pytesseract>=0.3.13",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "pyyaml>=6",
  "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.26",
  "ruff>=0.11",
  "pyright>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.13"
include = ["app", "tests"]
