# ============================================================
# Academio Production Stack — single VPS
#
# Public traffic path:
#   internet → nginx (host, :80/:443, TLS) → 127.0.0.1:{8080,8000} → containers
# Data services (postgres/redis/gotenberg) have NO host ports — reachable
# only inside the compose network.
#
# Deployed via deploy/scripts/deploy.sh from /opt/academio.
# Image tags come from --env-file .deploy.env (written by deploy.sh).
# App secrets come from env_file: .env (never committed).
# ============================================================
name: academio

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: academio-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-academio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-academio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-academio} -d ${DB_NAME:-academio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    container_name: academio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default_logging

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: academio-gotenberg
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default_logging

  api:
    image: ghcr.io/playbits/academio-api:${API_IMAGE_TAG:-latest}
    container_name: academio-api
    restart: unless-stopped
    # Bound to loopback ONLY — nginx on the host is the sole public entry.
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_ADDR: redis:6379
      GOTENBERG_URL: http://gotenberg:3000
      AI_ENGINE_URL: http://ai-engine:8000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default_logging

  ai-engine:
    image: ghcr.io/playbits/academio-ai-engine:${AI_IMAGE_TAG:-latest}
    container_name: academio-ai-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      AI_PGVECTOR_DSN: postgres://${DB_USER:-academio}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-academio}?sslmode=disable
      AI_UPLOADS_DIR: /app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default_logging

volumes:
  postgres_data:
  redis_data:
  uploads_data:
