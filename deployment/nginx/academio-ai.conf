# Academio AI Engine — ai-academio.playbit.org
# Installed to /etc/nginx/sites-available/academio-ai by bootstrap-vps.sh.
# Requires certs from: certbot certonly --standalone -d ai-academio.playbit.org

limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name ai-academio.playbit.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai-academio.playbit.org;

    ssl_certificate     /etc/letsencrypt/live/ai-academio.playbit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-academio.playbit.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Document uploads for OCR/embedding ingestion
    client_max_body_size 50M;

    access_log /var/log/nginx/academio-ai-access.log;
    error_log  /var/log/nginx/academio-ai-error.log warn;

    limit_req zone=ai_limit burst=20 nodelay;

    # LLM streaming + long OCR jobs: no buffering, generous timeouts.
    # Buffering is disabled vhost-wide — every meaningful route here either
    # streams tokens or blocks on document processing.
    proxy_buffering off;
    proxy_cache off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
